name: Create changelog

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# This workflow checks the changelog; it does not commit one.
#
# Committing from CI needed a GITHUB_TOKEN push, and GitHub starts no check run
# for such a push. The required "Lint with Prettier" check therefore stayed
# queued on the bot's own head commit, which blocked the pull request and added
# an unsigned commit. A check keeps `CHANGELOG.md` current without either
# problem. Run `npm run changelog` locally and commit the result.
permissions:
  contents: read

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Regenerate the changelog
        run: npm exec git-cliff -- --config cliff.toml --output CHANGELOG.md

      - name: Format the changelog
        run: npx prettier --write CHANGELOG.md

      - name: Fail if the changelog is out of date
        run: |
          if ! git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is out of date. Run 'npm run changelog' and commit the result."
            git --no-pager diff -- CHANGELOG.md
            exit 1
          fi
          echo "CHANGELOG.md is current."
