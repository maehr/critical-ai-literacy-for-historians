name: Create changelog

on:
  pull_request:
    branches:
      - main

# The ruleset on `main` requires a pull request, so the workflow commits to the
# pull request branch instead of to `main`.
#
# GITHUB_TOKEN pushes the commit. GitHub does not start a new check run for such
# a push, so the required check "Lint with Prettier" stays open on the new head
# commit. A maintainer must approve the queued run in the Actions tab. A personal
# access token in the repository secrets would remove that step.
permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    # A pull request from a fork gets a read-only token, so skip the commit.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Generate the changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Format the changelog
        run: npx prettier --write CHANGELOG.md

      - name: Commit the changelog
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs(changelog): update CHANGELOG.md'
          file_pattern: CHANGELOG.md
