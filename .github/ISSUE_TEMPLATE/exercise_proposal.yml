name: 💡 New Exercise Proposal
description: Propose a new exercise for the Critical AI Literacy for Historians curriculum
title: '[Exercise]: '
labels: ['exercise', 'enhancement']
assignees:
  - maehr
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new exercise. Give as much detail as possible.

        German leads in this repository. The German version is the reference version, and the English and French versions follow it. See `AGENTS.md` for the full contract.

        Do not name an AI product, an AI vendor, or a model. Describe what the tool must be able to do.

  - type: input
    id: exercise-title
    attributes:
      label: Exercise Title
      description: A clear, descriptive title for the exercise
      placeholder: e.g., "Evaluating AI Bias in Historical Datasets"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Exercise Description
      description: A brief overview of what the exercise covers and its purpose
      placeholder: Describe the main focus and goals of this exercise
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty Level
      description: Which learner is this exercise for? The value goes into the `difficulty` field of the front matter and stays in English.
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true

  - type: input
    id: time-estimate
    attributes:
      label: Estimated Time
      description: How long does the complete exercise take? The value goes into the `time_estimate` field. Use `min` for minutes and `d` for days. Be honest about a multi-day archive project.
      placeholder: 60 min
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: What must a learner know before this exercise? Also name every capability that the tool needs, and every non-AI requirement such as a reference manager or a library account.
      placeholder: |
        - Basic understanding of historical research methods
        - Familiarity with primary and secondary sources
        - A tool that can read an uploaded PDF file
    validations:
      required: true

  - type: textarea
    id: learning-objectives
    attributes:
      label: Learning Objectives
      description: What should learners be able to do after completing this exercise?
      placeholder: |
        - Understand how AI generates text
        - Apply source criticism to AI outputs
        - Identify biases in AI-generated content
    validations:
      required: true

  - type: textarea
    id: activities
    attributes:
      label: Proposed Activities
      description: Outline the main activities or tasks in the exercise
      placeholder: Describe the hands-on activities learners will engage with
    validations:
      required: true

  - type: dropdown
    id: categories
    attributes:
      label: Category
      description: Pick exactly one category. These four are the complete list (`AGENTS.md`, section 4). The German label is the value that goes into the German file. Ethics is a tag, and not a category.
      options:
        - KI & Digitale Methoden (AI & Digital Methods / IA & Méthodes numériques)
        - Quellen (Sources)
        - Methoden (Methods / Méthodes)
        - Public History
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Additional Resources
      description: List any readings, tools, or external resources needed
      placeholder: |
        - Links to relevant articles
        - Tools or software required
        - Background reading materials

  - type: textarea
    id: languages
    attributes:
      label: Language Support
      description: Which languages can you write this exercise in? German is the reference version, and English and French follow it.
      placeholder: |
        - [ ] German (Deutsch) - the reference version
        - [ ] English
        - [ ] French (Français)
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that would be helpful in developing this exercise
      placeholder: Related exercises, pedagogical approach, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Contribution Guidelines
      description: By submitting this proposal, you agree to follow our contribution guidelines
      options:
        - label: I have read the [CONTRIBUTING.md](../CONTRIBUTING.md) guidelines
          required: true
        - label: I agree to license my contribution under CC BY NC SA 4.0 for content and AGPL 3.0 for code
          required: true
        - label: I am willing to collaborate on developing this exercise if accepted
          required: false
