project:
  type: website

website:
  title: 'Critical AI Literacy for Historians'
  favicon: favicon.png
  open-graph: true
  twitter-card: true
  site-url: https://maehr.github.io/critical-ai-literacy-for-historians/
  repo-url: https://github.com/maehr/critical-ai-literacy-for-historians/
  issue-url: https://github.com/maehr/critical-ai-literacy-for-historians/issues/new/choose
