project:
  type: website

website:
  title: 'Critical AI Literacy for Historians'
  favicon: favicon.png
  open-graph: true
  twitter-card: true
  site-url: https://maehr.github.io/critical-ai-literacy-for-historians/
  repo-url: https://github.com/maehr/critical-ai-literacy-for-historians/
  issue-url: https://github.com/maehr/critical-ai-literacy-for-historians/issues/new/choose
  repo-actions: [edit, issue]
  draft-mode: visible
  page-navigation: true
  bread-crumbs: true
  back-to-top-navigation: true
  search:
    show-item-context: true
    type: overlay
  navbar:
    logo: favicon.svg
    logo-alt: 'Critical AI Literacy for Historians'
    title: 'Critical AI Literacy for *Historians*'
    tools:
      - icon: github
        url: https://github.com/maehr/critical-ai-literacy-for-historians/
    left:
      - text: English
        href: en/index.qmd
      - text: Deutsch
        href: de/index.qmd
      - text: Français
        href: fr/index.qmd
  sidebar:
    - id: en
      title: 'English'
      style: 'floating'
      collapse-level: 2
      contents:
        - text: 'About'
          href: en/index.qmd
        - section: 'Exercises'
          href: en/exercises/index.qmd
          contents: en/exercises/*
        - text: Glossary
          href: en/glossary.qmd
        - text: Bibliography
          href: en/bibliography.qmd
    - id: de
      title: 'Deutsch'
      style: 'floating'
      collapse-level: 2
      contents:
        - text: 'Über'
          href: de/index.qmd
        - text: 'Übungen'
          href: de/exercises/index.qmd
          contents: de/exercises/*
        - text: Glossar
          href: de/glossary.qmd
        - text: Bibliographie
          href: de/bibliography.qmd
    - id: fr
      title: 'Français'
      style: 'floating'
      collapse-level: 2
      contents:
        - text: 'À propos'
          href: fr/index.qmd
        - section: 'Exercices'
          href: fr/exercises/index.qmd
          contents: fr/exercises/*
        - text: Glossaire
          href: fr/glossary.qmd
        - text: Bibliographie
          href: fr/bibliography.qmd
format:
  html:
    toc: true
    brand: _brand.yml
    theme:
      - default
      - theme.scss
    code-copy: true
    code-overflow: wrap
    canonical-url: true

freeze: true

editor: visual
