      title: 'English'
      style: 'floating'
      collapse-level: 2
      contents:
        - text: 'About'
          href: en/index.qmd
        # Learning order, not alphabetical order. See en/index.qmd.
        - section: 'Exercises'
          href: en/exercises/index.qmd
          contents:
            - en/exercises/prompt-engineering.qmd
            - en/exercises/literature-research-social-security-ch.qmd
