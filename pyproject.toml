[project]
name = "critical-ai-literacy-for-historians"
version = "0.1.0"
description = "Structured exercises for developing critical AI literacy in historical research"
authors = [{ name = "Moritz Mähr", email = "moritz.maehr@unibe.ch" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["critical_ai_literacy_for_historians"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
