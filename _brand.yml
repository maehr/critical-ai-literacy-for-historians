meta:
  name: Critical AI Literacy for Historians
  link:
    home: https://maehr.github.io/critical-ai-literacy-for-historians
    github: https://github.com/maehr
  description: |
    Structured exercises for developing critical AI literacy in historical research

color:
  # Earthy pastel palette (for use in figures, callouts, backgrounds, accents)
  palette:
    ivory: '#FAF7F0' # warm off-white
    charcoal: '#1F1A17' # warm near-black (text)

    sand: '#E6D5B8'
    linen: '#D9D0C1'
    sage: '#A3B18A'
    eucalyptus: '#7AAE9B'
    clay: '#C97C5D'
    terracotta: '#B15A3A'
    rose-dust: '#D9A6A1'
    sky: '#A9C4D8'
    ocean: '#8BB4C5'
    mauve: '#C2B5D6'
    slate: '#5B6770'

  # High-contrast semantic roles (dark “earth” accents so they remain AAA on ivory)
  primary: '#1E4D3A' # deep pine
  secondary: '#5e513a' # linen (darkened for contrast)
  success: '#0F5E4E' # deep sea-green
  info: '#1F5A7A' # deep ocean-blue
  warning: '#6B4E2E' # dark umber
  danger: '#7A2E2E' # oxblood

  # Page defaults (AAA for body text)
  foreground: '#1F1A17'
  background: '#FAF7F0'

typography:
  fonts:
    - family: 'Hanken Grotesk'
      source: google
      weight: [300, 400, 500, 600, 700]
      style: normal

  base:
    family: 'Hanken Grotesk'
    size: 1rem
    weight: 400
    line-height: 1.5

  headings:
    family: 'Hanken Grotesk'
    weight: 600
    line-height: 1.2

  monospace:
    family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace'
# Go to https://quarto.org/docs/authoring/brand.html to learn more about multiformat branding with brand.yml
